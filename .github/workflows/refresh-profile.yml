name: Refresh GitHub profile

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install artwork dependencies
        run: pip install -r scripts/requirements.txt
      - name: Refresh public GitHub data and artwork
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_github.py
      - name: Commit updated profile assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh public GitHub profile statistics'
          git push origin HEAD:main
